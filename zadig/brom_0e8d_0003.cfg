# MediaTek BROM / boot ROM download mode (0e8d:0003) - for mtkclient
#
# Install this BEFORE plugging the phone in. The BROM only enumerates for a few
# seconds per power cycle (about 3.7 s on the A5 Pro), far too short to select it
# in Zadig by hand. "Load Preset Device" installs WinUSB for a device that is not
# connected, and Windows binds it automatically the moment the BROM appears.
[device]
  Description = "MediaTek BROM"
  VID = 0x0E8D
  PID = 0x0003
