# UMIDIGI A5 Pro - fastboot mode (0e8d:201c)
#
# Zadig > Device > Load Preset Device > this file > WinUSB > Install Driver.
#
# The GUID is the point of this preset. fastboot.exe looks the device up by
# Google's Android USB DeviceInterfaceGUID. A plain Zadig WinUSB install uses a
# random GUID, which leaves Device Manager showing the device as working while
# "fastboot devices" prints nothing.
[device]
  Description = "Android Bootloader Interface"
  VID = 0x0E8D
  PID = 0x201C
  GUID = "{F72FE0D4-CBCB-407d-8814-9ED673D0DD6B}"
